<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    body {
      background: #4a4a4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      touch-action: none;
    }

    .phone-frame {
      background: #2a2a2a;
      border-radius: 32px;
      padding: 16px;
      box-shadow:
        0 0 0 2px #1a1a1a,
        0 8px 32px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 420px;
      width: 98vw;
    }

    .screen-bezel {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 8px;
      width: 100%;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
    }

    .screen {
      background: #8bac0f;
      border-radius: 4px;
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      image-rendering: pixelated;
    }

    /* Nokia screen scanlines effect */
    .screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .score-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      color: #9bbc0f;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 0 4px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .brand {
      display: none;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      grid-template-rows: repeat(3, 72px);
      gap: 5px;
    }

    .dpad-btn {
      background: #3a3a3a;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #bbb;
      box-shadow:
        0 4px 0 #1a1a1a,
        inset 0 1px 0 rgba(255,255,255,0.1);
      transition: transform 0.05s, box-shadow 0.05s;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .dpad-btn:active,
    .dpad-btn.pressed {
      transform: translateY(3px);
      box-shadow:
        0 1px 0 #1a1a1a,
        inset 0 1px 0 rgba(255,255,255,0.1);
      background: #4a4a4a;
    }

    .dpad-center {
      background: #555;
      font-size: 13px;
      color: #aaa;
      letter-spacing: 0.5px;
      font-weight: bold;
    }

    .dpad-empty {
      background: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    .bottom-buttons {
      display: flex;
      gap: 20px;
    }

    .action-btn {
      background: #3a3a3a;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      cursor: pointer;
      color: #aaa;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      box-shadow:
        0 4px 0 #1a1a1a,
        inset 0 1px 0 rgba(255,255,255,0.1);
      transition: transform 0.05s, box-shadow 0.05s;
      touch-action: manipulation;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1a1a1a;
    }

    .nokia-logo {
      display: none;
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <div class="brand">NOKIA</div>

  <div class="screen-bezel">
    <div class="score-bar">
      <span id="scoreDisplay">SCORE: 0</span>
      <span id="levelDisplay">LVL: 1</span>
    </div>
    <div class="screen">
      <canvas id="gameCanvas"></canvas>
    </div>
  </div>

  <div class="dpad">
    <div class="dpad-btn dpad-empty"></div>
    <button class="dpad-btn" id="btnUp">▲</button>
    <div class="dpad-btn dpad-empty"></div>

    <button class="dpad-btn" id="btnLeft">◀</button>
    <button class="dpad-btn dpad-center" id="btnCenter">OK</button>
    <button class="dpad-btn" id="btnRight">▶</button>

    <div class="dpad-btn dpad-empty"></div>
    <button class="dpad-btn" id="btnDown">▼</button>
    <div class="dpad-btn dpad-empty"></div>
  </div>

  <div class="bottom-buttons">
    <button class="action-btn" id="btnMenu">MENU</button>
    <button class="action-btn" id="btnStart">START</button>
  </div>

  <div class="nokia-logo">NOKIA</div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const GRID = 20;
  canvas.width = GRID * GRID;
  canvas.height = GRID * GRID;

  // Nokia-style palette
  const COLOR = {
    bg: '#9bbc0f',
    bgDark: '#8bac0f',
    grid: '#8bac0f',
    snake: '#0f380f',
    snakeHead: '#0f380f',
    food: '#0f380f',
    text: '#0f380f',
    textBg: '#9bbc0f',
    border: '#306230',
  };

  let snake, dir, nextDir, food, score, highScore, gameLoop, state, level, stepInterval;
  // state: 'start' | 'playing' | 'paused' | 'gameover'

  highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');

  function init() {
    snake = [
      { x: 10, y: 10 },
      { x: 9,  y: 10 },
      { x: 8,  y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    level = 1;
    stepInterval = 180;
    spawnFood();
    updateHUD();
  }

  function spawnFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function step() {
    dir = { ...nextDir };

    const head = {
      x: (snake[0].x + dir.x + GRID) % GRID,
      y: (snake[0].y + dir.y + GRID) % GRID,
    };

    // Wall collision (solid walls instead of wrap)
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      endGame();
      return;
    }

    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      // Level up every 5 foods
      level = Math.floor(score / 5) + 1;
      stepInterval = Math.max(60, 180 - (level - 1) * 18);
      updateHUD();
      spawnFood();
      // Restart loop with new interval
      clearInterval(gameLoop);
      gameLoop = setInterval(step, stepInterval);
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    // Background
    ctx.fillStyle = COLOR.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Subtle grid
    ctx.strokeStyle = COLOR.grid;
    ctx.lineWidth = 0.3;
    for (let i = 0; i <= GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID, 0);
      ctx.lineTo(i * GRID, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * GRID);
      ctx.lineTo(canvas.width, i * GRID);
      ctx.stroke();
    }

    // Border
    ctx.strokeStyle = COLOR.border;
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

    // Food - blinking dot Nokia style
    const blink = Math.floor(Date.now() / 400) % 2;
    if (blink || state !== 'playing') {
      ctx.fillStyle = COLOR.food;
      const fx = food.x * GRID;
      const fy = food.y * GRID;
      // Nokia food: small square with dot pattern
      ctx.fillRect(fx + 3, fy + 3, GRID - 6, GRID - 6);
    }

    // Snake
    snake.forEach((seg, i) => {
      const x = seg.x * GRID;
      const y = seg.y * GRID;
      ctx.fillStyle = COLOR.snake;
      if (i === 0) {
        // Head - slightly different
        ctx.fillRect(x + 1, y + 1, GRID - 2, GRID - 2);
        // Eyes
        ctx.fillStyle = COLOR.bg;
        const ex = dir.x, ey = dir.y;
        if (ex === 1) { // right
          ctx.fillRect(x + GRID - 5, y + 3, 2, 2);
          ctx.fillRect(x + GRID - 5, y + GRID - 5, 2, 2);
        } else if (ex === -1) { // left
          ctx.fillRect(x + 3, y + 3, 2, 2);
          ctx.fillRect(x + 3, y + GRID - 5, 2, 2);
        } else if (ey === -1) { // up
          ctx.fillRect(x + 3, y + 3, 2, 2);
          ctx.fillRect(x + GRID - 5, y + 3, 2, 2);
        } else { // down
          ctx.fillRect(x + 3, y + GRID - 5, 2, 2);
          ctx.fillRect(x + GRID - 5, y + GRID - 5, 2, 2);
        }
      } else {
        // Body segment - classic Nokia chunky style
        ctx.fillRect(x + 1, y + 1, GRID - 2, GRID - 2);
        // Inner highlight
        ctx.fillStyle = COLOR.bgDark;
        ctx.fillRect(x + 4, y + 4, GRID - 8, GRID - 8);
        ctx.fillStyle = COLOR.snake;
      }
    });
  }

  function drawOverlay(title, lines) {
    // Semi-transparent overlay
    ctx.fillStyle = 'rgba(139, 172, 15, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Box
    const bw = 240, bh = lines.length * 22 + 50;
    const bx = (canvas.width - bw) / 2;
    const by = (canvas.height - bh) / 2;

    ctx.fillStyle = COLOR.bg;
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = COLOR.text;
    ctx.lineWidth = 3;
    ctx.strokeRect(bx, by, bw, bh);
    // Inner border
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 4, by + 4, bw - 8, bh - 8);

    ctx.fillStyle = COLOR.text;
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(title, canvas.width / 2, by + 30);

    ctx.font = '13px "Courier New", monospace';
    lines.forEach((line, i) => {
      ctx.fillText(line, canvas.width / 2, by + 52 + i * 22);
    });
    ctx.textAlign = 'left';
  }

  function drawStart() {
    draw();
    drawOverlay('SNAKE', [
      'Pressione OK',
      'ou START',
      'para jogar',
      '',
      `RECORDE: ${highScore}`,
    ]);
  }

  function drawPaused() {
    draw();
    drawOverlay('PAUSADO', [
      'Pressione OK',
      'para continuar',
    ]);
  }

  function drawGameOver() {
    draw();
    drawOverlay('FIM DE JOGO', [
      `PONTOS: ${score}`,
      `RECORDE: ${highScore}`,
      '',
      'Pressione OK',
      'para jogar de',
      'novo',
    ]);
  }

  function updateHUD() {
    document.getElementById('scoreDisplay').textContent = `SCORE: ${score}`;
    document.getElementById('levelDisplay').textContent = `LVL: ${level}`;
  }

  function startGame() {
    if (state === 'playing') return;
    init();
    state = 'playing';
    clearInterval(gameLoop);
    gameLoop = setInterval(step, stepInterval);
    draw();
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    clearInterval(gameLoop);
    drawPaused();
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    gameLoop = setInterval(step, stepInterval);
    draw();
  }

  function endGame() {
    clearInterval(gameLoop);
    state = 'gameover';
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
    }
    drawGameOver();
  }

  function handleOK() {
    if (state === 'start' || state === 'gameover') {
      startGame();
    } else if (state === 'playing') {
      pauseGame();
    } else if (state === 'paused') {
      resumeGame();
    }
  }

  // Keyboard controls
  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W':
        e.preventDefault();
        if (dir.y !== 1)  nextDir = { x: 0, y: -1 };
        break;
      case 'ArrowDown':  case 's': case 'S':
        e.preventDefault();
        if (dir.y !== -1) nextDir = { x: 0, y: 1 };
        break;
      case 'ArrowLeft':  case 'a': case 'A':
        e.preventDefault();
        if (dir.x !== 1)  nextDir = { x: -1, y: 0 };
        break;
      case 'ArrowRight': case 'd': case 'D':
        e.preventDefault();
        if (dir.x !== -1) nextDir = { x: 1, y: 0 };
        break;
      case 'Enter': case ' ':
        e.preventDefault();
        handleOK();
        break;
      case 'p': case 'P':
        if (state === 'playing') pauseGame();
        else if (state === 'paused') resumeGame();
        break;
    }
  });

  // D-pad buttons
  function setupBtn(id, action) {
    const btn = document.getElementById(id);
    if (!btn) return;
    ['touchstart', 'mousedown'].forEach(ev => {
      btn.addEventListener(ev, e => {
        e.preventDefault();
        btn.classList.add('pressed');
        action();
      });
    });
    ['touchend', 'mouseup', 'mouseleave'].forEach(ev => {
      btn.addEventListener(ev, () => btn.classList.remove('pressed'));
    });
  }

  setupBtn('btnUp',    () => { if (state === 'playing' && dir.y !== 1)  nextDir = { x: 0, y: -1 }; });
  setupBtn('btnDown',  () => { if (state === 'playing' && dir.y !== -1) nextDir = { x: 0, y: 1 }; });
  setupBtn('btnLeft',  () => { if (state === 'playing' && dir.x !== 1)  nextDir = { x: -1, y: 0 }; });
  setupBtn('btnRight', () => { if (state === 'playing' && dir.x !== -1) nextDir = { x: 1, y: 0 }; });
  setupBtn('btnCenter', handleOK);
  setupBtn('btnStart',  handleOK);
  setupBtn('btnMenu', () => {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  });

  // Swipe / touch controls on canvas
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);

    if (adx < 10 && ady < 10) {
      handleOK();
      return;
    }

    if (state !== 'playing') {
      handleOK();
      return;
    }

    if (adx > ady) {
      if (dx > 0 && dir.x !== -1) nextDir = { x: 1,  y: 0 };
      else if (dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
    } else {
      if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1  };
      else if (dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
    }
    touchStart = null;
  }, { passive: false });

  // Prevent scroll
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // Boot
  state = 'start';
  init();
  drawStart();

  // Redraw food blink on start screen
  setInterval(() => {
    if (state === 'start') drawStart();
    else if (state === 'gameover') drawGameOver();
  }, 400);
</script>
</body>
</html>
